[package]
name = "domain-key"
version = "0.5.2"
edition = "2021"
rust-version = "1.86"
# Rust 1.86 enables: #[expect(lint)] (1.81), core::error::Error in no_std (1.81),
# const {} blocks (1.83), edition 2024 manifests in deps (1.85+)
authors = ["vanyastaff <vanya.john.stafford@gmail.com>"]
license = "MIT"
description = "High-performance, domain-driven, type-safe key system for Rust"
homepage = "https://github.com/vanyastaff/domain-key"
repository = "https://github.com/vanyastaff/domain-key"
documentation = "https://docs.rs/domain-key"
readme = "README.md"
keywords = ["domain", "key", "type-safe", "ddd", "performance"]
categories = ["data-structures", "development-tools"]
include = [
    "src/**/*",
    "examples/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "docs/**/*"
]

[dependencies]
# Core dependencies (always required)
smartstring = { version = "1.0", default-features = false }
thiserror = { version = "2.0", default-features = false }

# Optional dependencies
serde = { version = "1.0", optional = true, default-features = false, features = ["derive"] }

# Typed UUID identifiers
uuid = { version = "1", optional = true, default-features = false }

# Property-based testing and fuzzing support
arbitrary = { version = "1", optional = true, default-features = false, features = ["derive"] }
proptest = { version = "1", optional = true, default-features = false, features = ["std", "bit-set"] }

# Typed ULID identifiers (prefixed Crockford Base32)
ulid = { version = "1", optional = true, default-features = false, features = ["std", "rand"] }

# UTC timestamps for Ulid::created_at
chrono = { version = "0.4", optional = true, default-features = false, features = ["clock"] }

# Hash algorithms (mutually exclusive - choose one)
ahash = { version = "0.8", optional = true, default-features = false }
blake3 = { version = "1.5", optional = true, default-features = false }
gxhash = { version = "3.0", optional = true, default-features = false }

# Framework integrations
sqlx = { version = "0.8", optional = true, default-features = false }
axum = { version = "0.8", optional = true, default-features = false }
actix-web = { version = "4", optional = true, default-features = false }

[dev-dependencies]
serde_json = "1.0"
criterion = { version = "0.8", features = ["html_reports"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls"] }
tower = { version = "0.5", features = ["util"] }

[features]
# Default: works for 80% of users out of the box
default = ["std", "serde"]

# ============================================================================
# CORE FEATURES
# ============================================================================

# Standard library support
std = ["thiserror/std", "serde?/std", "smartstring/std"]

# No standard library support (experimental)
no_std = []

# Serialization support
serde = ["dep:serde", "smartstring/serde", "uuid?/serde"]

# ============================================================================
# PERFORMANCE PROFILES (choose ONE)
# ============================================================================

# Maximum performance: gxhash on AES-NI capable CPUs, ahash as fallback
fast = ["dep:gxhash", "dep:ahash"]

# DoS resistance (public APIs, untrusted input)
secure = ["dep:ahash"]

# Cryptographic security (sensitive applications)
crypto = ["dep:blake3"]

# ============================================================================
# TYPED IDENTIFIER FEATURES
# ============================================================================

# UUID support for Uuid<D> typed identifiers
uuid = ["dep:uuid", "uuid/std"]
uuid-v4 = ["uuid", "uuid/v4"]
uuid-v7 = ["uuid", "uuid/v7"]

# ULID support for Ulid<D> (prefixed strings). Implies `std` so `ulid`/chrono match this crate's lib target.
ulid = ["std", "dep:ulid", "dep:chrono"]
# Monotonic ULID generation (`ulid::Generator`); implies `ulid` (hence `std`).
ulid-monotonic = ["ulid"]

# Property-based testing (requires std; full proptest!+Strategy+TestRunner require std)
# When `arbitrary` is combined with `uuid`, uuid's own Arbitrary impl is activated via uuid/arbitrary.
# ulid 1.x does not expose an Arbitrary feature — Ulid<D>'s impl is hand-written in arbitrary_impls.rs.
arbitrary = ["dep:arbitrary", "uuid?/arbitrary"]
proptest = ["std", "dep:proptest"]

# Integrations
sqlx = ["std", "dep:sqlx"]
sqlx-postgres = ["sqlx", "sqlx/postgres", "sqlx/uuid"]
sqlx-mysql = ["sqlx", "sqlx/mysql"]
sqlx-sqlite = ["sqlx", "sqlx/sqlite"]
axum = ["std", "dep:axum", "axum/json", "axum/form"]
actix-web = ["std", "dep:actix-web"]

[[bench]]
name = "key_benchmark"
harness = false

[package.metadata.docs.rs]
features = ["std", "serde", "secure", "uuid", "ulid", "ulid-monotonic", "arbitrary", "proptest"]
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -2 }
redundant_clone = "deny"

[profile.dev]
opt-level = 0
debug = true
lto = false

[profile.release]
opt-level = 3
debug = false
lto = "thin"        # Use thin LTO to avoid bitcode conflicts
codegen-units = 1
panic = "abort"
strip = true        # Strip debug symbols from release builds

[profile.test]
opt-level = 1
debug = true
lto = false         # Never use LTO for tests

[profile.bench]
opt-level = 3
debug = 2
lto = false         # Disable LTO for benchmarks to avoid conflicts
codegen-units = 1

# Custom profile for maximum performance (use with caution)
[profile.max-perf]
inherits = "release"
lto = "fat"         # Only use fat LTO in this special profile
codegen-units = 1
panic = "abort"
